<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>Zoom Meeting Reporter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-mark">ZR</div>
        <div class="brand-text">
          <h1>Zoom Meeting Reporter</h1>
          <p>Turn Zoom transcripts into polished Word meeting reports</p>
        </div>
      </div>
      <button id="openFolderBtn" class="btn btn-ghost" type="button">Open Output Folder</button>
    </header>

    <main class="app-main">
      <section id="dropZone" class="drop-zone">
        <div class="drop-zone-inner">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 16V4M12 4L7 9M12 4L17 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16V18C4 19.1046 4.89543 20 6 20H18C19.1046 20 20 19.1046 20 18V16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <p class="drop-zone-title">Drag &amp; drop .vtt transcript files here</p>
          <p class="drop-zone-sub">or</p>
          <button id="browseBtn" class="btn btn-primary" type="button">Browse Files</button>
        </div>
      </section>

      <section id="meetingsSection" class="meetings-section hidden">
        <div class="meetings-header">
          <h2 id="meetingsCount">0 transcripts uploaded</h2>
          <button id="clearBtn" class="btn btn-ghost btn-small" type="button">Clear All</button>
        </div>
        <div id="meetingsList" class="meetings-list"></div>

        <div class="generate-bar">
          <span id="statusText" class="status-text"></span>
          <button id="generateBtn" class="btn btn-primary btn-large" type="button" disabled>
            Generate Report
          </button>
        </div>
      </section>

      <section id="resultsSection" class="results-section hidden">
        <h2>Report Results</h2>
        <div id="resultsList" class="results-list"></div>
      </section>
    </main>
  </div>

  <script src="renderer.js" type="module"></script>
</body>
</html>
